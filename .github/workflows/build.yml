name: Build APK

# Roda só quando você clicar em "Run workflow" (aba Actions)
# ou quando o código do app mudar no main — mudanças no README não disparam build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build.yml"

# Se você der dois pushes seguidos, o build antigo é cancelado (economiza minutos).
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WallCycle-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # Guarda o APK por 3 dias para não acumular armazenamento.
          retention-days: 3
