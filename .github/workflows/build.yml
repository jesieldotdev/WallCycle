name: Build APK

# Roda só quando você clicar em "Run workflow" (aba Actions)
# ou quando o código do app mudar no main — mudanças no README não disparam build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build.yml"

# Se você der dois pushes seguidos, o build antigo é cancelado (economiza minutos).
concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Chave fixa (Secrets do repositório) para que cada APK novo instale por
      # cima do anterior. Sem os secrets, o build usa uma chave temporária.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wallcycle.keystore"
            echo "WALLCYCLE_KEYSTORE=$RUNNER_TEMP/wallcycle.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado — o APK não vai atualizar por cima da versão instalada."
          fi

      - name: Compilar APK
        env:
          WALLCYCLE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WALLCYCLE_KEY_ALIAS: wallcycle
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WallCycle-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # Guarda o APK por 3 dias para não acumular armazenamento.
          retention-days: 3

      # Atualiza o download público usado pela landing page
      # (releases/latest/download/WallCycle.apk). Sempre substitui o arquivo anterior.
      - name: Atualizar download da landing page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WallCycle.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest WallCycle.apk --clobber
          else
            gh release create latest WallCycle.apk --title "WallCycle" --notes "Versão mais recente do WallCycle. Baixe o WallCycle.apk e instale no Android."
          fi
